; Хостовые юнит-тесты общего кода.
;
; Прошивок здесь нет: это отдельный проект PlatformIO ровно для того, чтобы
; логику из ../common можно было гонять на машине разработчика, не трогая
; платы. Прогон:
;
;   pio test -d firmware/native -e native

[env:native]
platform = native
test_framework = unity

; Общий код подключается ровно так же, как в tx и rx — одним и тем же
; каталогом. Копий нет: если файл здесь и файл в прошивке разойдутся, это
; будет один и тот же файл, разошедшийся сам с собой.
lib_extra_dirs = ../common
lib_deps =
    g920-util
    g920-proto
    g920-identity
    g920-link
    g920-gip
    g920-detect
    g920-trace
lib_ldf_mode = deep+

build_flags =
    -std=c11
    -Wall
    -Wextra
    -DG920_ROLE=G920_ROLE_HOST_TEST
