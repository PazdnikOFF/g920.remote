; TX — передатчик у руля. USB Host.
;
;   pio run -d firmware/tx                 ; плата на руках
;   pio run -d firmware/tx -e tx-supermini ; целевая плата
;
; Роль host требует внешних 5 В на VBUS розетки, куда втыкается кабель руля:
; сам разъём платы на выдачу не рассчитан. Распайка — в docs/HARDWARE.md.

[platformio]
default_envs = tx-devkit

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; 4 МБ — нижняя общая граница всех плат проекта. Образ под 4 МБ поедет на
; любой S3, обратное — нет. Держать в паре с CONFIG_ESPTOOLPY_FLASHSIZE_4MB
; в sdkconfig.defaults: иначе esptool ругается на расхождение.
board_upload.flash_size = 16MB
; QIO вдвое быстрее DIO на чтении. Значимо не само чтение, а промахи кэша
; инструкций: каждый стоит микросекунд и даёт джиттер. Держать в паре с
; CONFIG_ESPTOOLPY_FLASHMODE_QIO в sdkconfig.defaults.
; ⚠ Не загрузилась плата — откатывать это первым.
board_build.flash_mode = qio

; Общий код — теми же каталогами, что и в rx и native. Ни одной копии.
lib_extra_dirs = ../common
lib_deps =
    g920-util
    g920-proto
    g920-identity
    g920-link
    g920-gip
    g920-detect
    g920-trace
    g920-board
lib_ldf_mode = deep+

build_flags =
    -Wall
    -Wextra
    -DG920_ROLE=G920_ROLE_TX

; --- Лог: уровень задаётся сборкой, а не только временем выполнения ------
;
; `G920_LOG_BUILD_LEVEL` убирает вызовы целиком, вместе с вычислением
; аргументов: печать в горячем пути в этом проекте уже дважды управляла
; временем на шине (сорванное знакомство в M1, watchdog в M8), и на проде
; платить за неё нельзя. Значения: -1 молчать, 0 ошибки, 1 плюс
; предупреждения, 2 плюс сведения (по умолчанию), 3 плюс отладка.
;
; `G920_LOG_PSRAM_BYTES` уводит лог в кольцо в PSRAM: строка стоит memcpy
; вместо 45 мс на 115200, а после аварии её есть где взять. Задан — UART
; замолкает после строки с версией.
;
; Отладочные профили обоих ниже не ставят: лог идёт в UART, как и раньше.

; --- ESP32-S3-DevKitC-1: то, что на руках --------------------------------
;
; Нативный USB (GPIO19/20) уходит на роль host, отладочный лог идёт через
; второй порт — мост UART. Переходник для отладки не нужен.
[env:tx-devkit]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; Адресный светодиод. У ревизии v1.0 это GPIO48, у v1.1 — GPIO38.
    ; Не светится — поменяйте здесь, это одна строка.
    -DG920_LED_WS2812=48

; --- ESP32-S3 Supermini: целевая плата, пока не на руках -----------------
[env:tx-supermini]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; Пин не подтверждён по живой плате, см. открытые вопросы в PROGRESS.md.
    -DG920_LED_GPIO=48

; --- Прод: рабочая прошивка на целевой плате -----------------------------
;
; Отдельный профиль, а не флаги, дописанные к `tx-supermini`.
;
; В `platformio.ini` живут **две независимые оси** — плата и прошивка, — и
; профили именуются по плате. Дописать режим в профиль платы значит склеить
; оси: `tx-supermini` перестал бы означать «Supermini» и стал бы означать
; «Supermini с хостом», а собрать на ней замерочную прошивку стало бы нечем.
;
; Отличий от `tx-host` ровно два, и оба про отсутствие наблюдателя.
[env:tx-prod]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DG920_MODE_HOST
    -DG920_LED_GPIO=48
    ; Логов на проде нет вовсе — ни в UART, ни в кольцо.
    ;
    ; Печать в горячем пути здесь опаснее всего: через этот цикл идут
    ; повторы линка и силы, и оба раза, когда она уже ломала обмен (M1, M8),
    ; ломала она его именно тут. Под рулём читать её всё равно некому, а
    ; состояние показывает светодиод.
    ;
    ; Понадобится посмертный журнал на выезде (перезагрузка консоли,
    ; мёртвая рука на живом обрыве) — собирается тем же профилем с двумя
    ; флагами в командной строке, править ini для этого не нужно:
    ;
    ;   pio run -d firmware/tx -e tx-prod \
    ;     --build-flag="-UG920_LOG_BUILD_LEVEL -DG920_LOG_BUILD_LEVEL=1" \
    ;     --build-flag="-DG920_LOG_PSRAM_BYTES=65536"
    -DG920_LOG_BUILD_LEVEL=G920_LOG_LEVEL_OFF

; --- USB Host: проба вехи M1 ---------------------------------------------
;
; TX поднимается хостом и выкладывает в лог всё, что узнал о подключённом
; устройстве. Ничего не открывает и не переключает: M1 — первое поднятие
; капризного стека, и чем меньше делает прошивка, тем короче список
; подозреваемых при неудаче.
;
; Она же проверяет сборку железа: энумерировался руль — значит распайка
; (D− на GPIO19, D+ на GPIO20, общая земля) и внешние 5 В на VBUS верны.
;
; ⚠ Разъём `USB` платы должен остаться **пустым**: GPIO19/20 разведены на
; него параллельно с гребёнкой.
[env:tx-host]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DG920_MODE_HOST
    -DG920_LED_WS2812=48
    ; Маяк: плата по очереди держит 3.3 В на D+ и D−, чтобы человек с
    ; тестером нашёл их на дальнем конце и убедился, что провод доходит до
    ; ноги чипа. В обычной работе вреден — те же 3.3 В читаются как признак
    ; подключённого устройства. Раскомментировать после перепайки.
    ; -DG920_HOST_BEACON
