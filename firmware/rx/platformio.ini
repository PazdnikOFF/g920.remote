; RX — донгл у хоста. USB Device.
;
;   pio run -d firmware/rx                 ; плата на руках
;   pio run -d firmware/rx -e rx-dongle    ; целевая плата
;
; Нативный USB (GPIO19/20) уходит на роль device и идёт к хосту. Распайка —
; в docs/HARDWARE.md.
;
; Заливка: пока прошивка не переключила USB в режим OTG, плата шьётся как
; обычно. После M2 на T-Dongle — только вручную: зажать BOOT, воткнуть,
; залить. На девките остаётся второй порт (мост UART), и это проще.

[platformio]
default_envs = rx-devkit

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; 4 МБ — нижняя общая граница всех плат проекта. Поднимем до 16 МБ вместе с
; кольцевым журналом трасс на T-Dongle, не раньше. Держать в паре с
; CONFIG_ESPTOOLPY_FLASHSIZE_4MB в sdkconfig.defaults.
board_upload.flash_size = 16MB
; QIO вдвое быстрее DIO на чтении. Значимо не само чтение, а промахи кэша
; инструкций: каждый стоит микросекунд и даёт джиттер. Держать в паре с
; CONFIG_ESPTOOLPY_FLASHMODE_QIO в sdkconfig.defaults.
; ⚠ Не загрузилась плата — откатывать это первым.
board_build.flash_mode = qio

; Общий код — теми же каталогами, что и в tx и native. Ни одной копии.
lib_extra_dirs = ../common
lib_deps =
    g920-util
    g920-proto
    g920-identity
    g920-link
    g920-gip
    g920-detect
    g920-trace
    g920-board
lib_ldf_mode = deep+

build_flags =
    -Wall
    -Wextra
    -DG920_ROLE=G920_ROLE_RX

; --- Лог: уровень задаётся сборкой, а не только временем выполнения ------
;
; `G920_LOG_BUILD_LEVEL` убирает вызовы целиком, вместе с вычислением
; аргументов: печать в горячем пути в этом проекте уже дважды управляла
; временем на шине (сорванное знакомство в M1, watchdog в M8), и на проде
; платить за неё нельзя. Значения: -1 молчать, 0 ошибки, 1 плюс
; предупреждения, 2 плюс сведения (по умолчанию), 3 плюс отладка.
;
; `G920_LOG_PSRAM_BYTES` уводит лог в кольцо в PSRAM: строка стоит memcpy
; вместо 45 мс на 115200, а после аварии её есть где взять. Задан — UART
; замолкает после строки с версией.
;
; Отладочные профили обоих ниже не ставят: лог идёт в UART, как и раньше.

; --- ESP32-S3-DevKitC-1: то, что на руках --------------------------------
;
; Дисплея, слота TF и APA102 здесь нет: статус уходит в UART через второй
; порт, трассы M2 — туда же. На эталоны это не влияет, только на удобство.
[env:rx-devkit]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; Адресный светодиод. У ревизии v1.0 это GPIO48, у v1.1 — GPIO38.
    ; Не светится — поменяйте здесь, это одна строка.
    -DG920_LED_WS2812=48

; --- Замерочные профили: линк, без USB ----------------------------------
;
; `main.c` — прошивка вехи M3: отражает кадры и считает потери. Файлы
; USB-устройства без `-DG920_MODE_GIP` компилируются пустыми, поэтому
; TinyUSB **в образ не попадает**.
;
; Проверять это надо составом, а не размером: размер меняется и по
; посторонним причинам — одну такую уже поймали, лог мощности передатчика в
; `g920_link_init` дал +220 байт. Прямая проверка:
;
;   xtensa-esp32s3-elf-nm .pio/build/rx-devkit/firmware.elf | grep -c 'tud_\|tusb_\|usbd_\|dcd_'
;
; В замерочных профилях это **ноль**, в `rx-gip` — 51.

; --- LilyGo T-Dongle-S3-Plus: целевая плата, пока не на руках ------------
[env:rx-dongle]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; APA102 — единственный индикатор на плате, обычного светодиода нет.
    -DG920_LED_APA102_DIN=40
    -DG920_LED_APA102_CLK=39

; --- Прод: рабочая прошивка на целевой плате -----------------------------
;
; Отдельный профиль, а не флаги, дописанные к `rx-dongle`.
;
; В `platformio.ini` живут **две независимые оси** — плата и прошивка, — и
; профили именуются по плате. Дописать режим в профиль платы значит склеить
; оси: `rx-dongle` перестал бы означать «T-Dongle» и стал бы означать
; «T-Dongle с GIP», а контрольный замер M3 на целевой плате стало бы нечем
; воспроизвести.
[env:rx-prod]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DG920_MODE_GIP
    ; APA102 — единственный индикатор на плате, обычного светодиода нет.
    -DG920_LED_APA102_DIN=40
    -DG920_LED_APA102_CLK=39
    ; Логов на проде нет вовсе — ни в UART, ни в кольцо.
    ;
    ; У донгла в консоли UART физически некому читать: порт уходит на QWIIC,
    ; а переходник в игре не воткнут. Состояние показывает APA102.
    ;
    ; Посмертный журнал на выезде собирается тем же профилем с двумя флагами
    ; в командной строке — см. `firmware/tx/platformio.ini`, там же пример.
    -DG920_LOG_BUILD_LEVEL=G920_LOG_LEVEL_OFF


; --- GIP-устройство: прошивка вехи M2 ------------------------------------
;
; RX втыкается в хост и записывает, что тот делает: control-запросы, их
; порядок и интервалы, STALL, первый опрос IN. Из этих трасс в M6
; **выводятся** пороги детектора платформы.
;
; Отдельный профиль, а не замена замерочной прошивке: контрольный замер M3
; воспроизводится в любой момент, не откатывая ничего. Разделение — по
; `build_src_filter`, то есть по тому, какой `main` попадает в сборку.
[env:rx-gip]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; Выбирает прошивку: с ним собирается main_gip.c, без него — main.c.
    ; Фильтром исходников это сделать нельзя, см. комментарий в самих файлах.
    -DG920_MODE_GIP
    -DG920_LED_WS2812=48
