## Манифест менеджера компонентов IDF.
##
## TinyUSB нужен ровно одной сборке — профилю `rx-gip`, где RX поднимается
## USB-устройством. Манифест при этом один на проект: менеджер компонентов
## не знает про профили PlatformIO. Замерочные профили (`rx-devkit`,
## `rx-dongle`) компонент компилируют, но не зовут — ни одного обращения к
## `tinyusb_*` в их коде нет, и линкер выбрасывает его целиком.
##
## Проверять это надо не размером образа, а составом: размер меняется и по
## посторонним причинам (одну такую уже поймали — лог мощности передатчика
## подрос на 220 байт). Прямая проверка — `nm` по firmware.elf: в профилях
## `rx-devkit` / `rx-dongle` символов `tud_`, `tusb_`, `usbd_`, `dcd_`
## должно быть **ноль**, в `rx-gip` их полсотни.
##
## ── Почему голый tinyusb, а не esp_tinyusb ─────────────────────────────
##
## Обёртка `espressif/esp_tinyusb` удобна, но она реализует
## `tud_descriptor_string_cb` сама и на индекс вне своего массива отвечает
## NULL, то есть STALL. Индекс `0xEE` — это MS OS Descriptor, без которого
## опознание GIP-устройства неполно, а перекрыть её функцию нечем: символ
## лежит в одном архиве с тем, что линкуется в любом случае.
##
## В M2 дескрипторы и **есть** предмет вехи: мы смотрим, что именно спросил
## хост и что именно он получил в ответ, включая STALL по политике из
## `g920/gip_stub.h`. Прослойка, отвечающая за нас, здесь не удобство, а
## потеря наблюдаемости. Цена голого стека — своя инициализация PHY
## (`esp_private/usb_phy.h`) и своя задача tusb, это два десятка строк.
dependencies:
  espressif/tinyusb: "~0.19"
  idf: ">=5.0"
